name: car-launcher

services:
  # Build-only toolchain: `docker compose run --rm android gradle :app:assembleDebug` → android/app/build/outputs/apk/debug/
  android:
    build: ./infra/android-sdk
    image: car-launcher-android-sdk:local
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./android:/workspace
      - gradle-cache:/root/.gradle
      # The debug signing key lives in ~/.android — persist it, or every build gets a new key and
      # `adb install -r` fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE (signatures do not match).
      - android-home:/root/.android

volumes:
  gradle-cache:
  android-home:

# Docker address pools on this host are exhausted — pinned free subnet (tadri .20, tadri-explainer .21, futurex-ws .22).
networks:
  default:
    ipam:
      config:
        - subnet: 10.252.23.0/24
